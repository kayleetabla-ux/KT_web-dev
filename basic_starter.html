<!DOCTYPE html> 
<html>
    <head>
        <title>Basic starter</title>
        <meta charset = "UTF-8">
    </head>
    <style>
        #complementary{
           background-color:rgba(121, 6, 6, 0.863);
                border-radius: 4px;
                width: 25%;
                height: 100px;
                font-size: 2em;
                border: dashed 6px rgb(22, 99, 41);
                text-align: center;
        }
        #analogous{
            background-color:rgba(199, 90, 172, 0.863);
                border-radius: 4px;
                width: 25%;
                height: 100px;
                font-size: 2em;
                border: dotted 7px rgb(120, 27, 133);
                text-align: center;

        }
        #triadic{
            background-color:rgba(227, 230, 98, 0.863);
                border-radius: 4px;
                width: 25%;
                height: 100px;
                font-size: 2em;
                border: solid 5px rgb(134, 20, 5);
                color: rgb(0, 83, 238);
                text-align: center;
        }
    </style>
    <body>
        <div id="complementary">
        <p>
            complementary
        </p>
        </div>
        <div id="analogous">
        <p>
            analogous
        </p>
        </div>
        <div id="triadic">
        <p>
            triadic
        </p>
        </div>
    </body>
</html>
