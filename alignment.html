<!DOCTYPE html> 
<html> <!-- This is a comment -->
    <head>
        <title>Alignment</title>
        <meta charset = "UTF-8">
        <style>
            button{
                padding: 20px;
                margin: 8px;
                margin-left: 50px;
            }
            #box{
                width: 75px;
                height: 75px;
                background-color: blue;
                color: azure;
                text-align: center;
            }
            #box-wrapper{
                display: grid;
                grid-template-columns: 1fr 300px 1fr;
                gap: 5px;

            }
            #flex-wrapper{
                display:flex;
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                flex-wrap: wrap;
                
            }
        </style>
    </head>
    <body>
        <h1> Alignment Notes</h1>
        <div id="box-wrapper">
            <div id="box">
                <p>Box 1</p>
            </div>
            <div id="box">
                <p>Box 3</p>
            </div>
            <div id="box">
                <p>Box 4</p>
            </div>
            <div id="box">
                <p>Box 5</p>
            </div>
        </div>
         <div id="flex-wrapper">
            <div id="box">
                <p>Box 1</p>
            </div>
            <div id="box">
                <p>Box 3</p>
            </div>
            <div id="box">
                <p>Box 4</p>
            </div>
            <div id="box">
                <p>Box 5</p>
            </div>
        </div>
        <button>Click Me</button>
    </body>
</html>
