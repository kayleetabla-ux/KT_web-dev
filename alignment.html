<!DOCTYPE html> 
<html> <!-- This is a comment -->
    <head>
        <title>Alignment</title>
        <meta charset = "UTF-8">
        <style>
            button{
                padding: 20px;
                margin: 8px;
                margin-left: 50px;
            }
            #box, #boxTwo{
                width: 75px;
                height: 75px;
                background-color: blue;
                color: azure;
                text-align: center;
            }
            #box-wrapper{
                display: grid;
                grid-template-columns: 1fr 300px 1fr;
                gap: 5px;

            }
            #flex-wrapper{
                display:none;
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                flex-wrap: wrap;
                
            }
            #apple{
                width:150px
            }
        </style>
    </head>
    <body>
        <h1> Alignment Notes</h1>
        <img src="https://images.rawpixel.com/image_800/czNmcy1wcml2YXRlL3Jhd3BpeGVsX2ltYWdlcy93ZWJzaXRlX2NvbnRlbnQvcGR3YXRlcmNvbG9yZnJ1aXRiYXRjaDEtMzU1LWpqLWNfMi5qcGc.jpg" alt="apple" id="apple"
        onmouseout="changeImage()"> 
        <div id="box-wrapper">
            <div id="box" onmouseover="disapear()" onmouseout="appear()">
                <p>Box 1</p>
            </div>
            <div id="box">
                <p>Box 2</p>
            </div>
            <div id="box">
                <p>Box 3</p>
            </div>
            <div id="box">
                <p>Box 4</p>
            </div>
        </div>
         <div id="flex-wrapper">
            <div id="box">
                <p>Box 1</p>
            </div>
            <div id="boxTwo">
                <p>Box 2</p>
            </div>
            <div id="box">
                <p>Box 3</p>
            </div>
            <div id="box">
                <p>Box 4</p>
            </div>
        </div>
        <input type="color" id="colorPicker">
        <button onClick="color()">Click Me</button>
        <button id="showMore" onClick="show()">Show More</button>
    </body>
    <script>
        let images = ["https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRzjIYwJhnKL-A1wwYyaLWwpTjgglRLwvggS6o0SifWgg&s=10", "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQpjojfiuT_hfv-dG3sWYkOxXQ7uBv7HB_bk5-feuhoGRyPVogE3LzemT1A&s=10", "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSD4dWBdkpeB_zAH68HoA05xutJZo3bxyzbj_O_ppv6vE4nvISYxrLNE6Te&s=10", "https://images.rawpixel.com/image_800/czNmcy1wcml2YXRlL3Jhd3BpeGVsX2ltYWdlcy93ZWJzaXRlX2NvbnRlbnQvcGR3YXRlcmNvbG9yZnJ1aXRiYXRjaDEtMzU1LWpqLWNfMi5qcGc.jpg" ]
        let current=0
        function changeImage(){
            current += 1
            if (current > 3){
                current=0
            }
            document.getElementById("apple").src=images[current]
            
        }
        //makes the webpage interactive 
        function color()  {
            let newColor = document.getElementById ("colorPicker").value 
            document.getElementById ("box").style.backgroundColor = newColor
           
        }
        function disapear(){
            document.getElementById
            ("boxTwo").style.display = 'none'
        }
        function appear(){
            document.getElementById("boxTwo").style.display = 'block'
        }
        function show(){
            let element = document.getElementById("flex-wrapper")
            if (element.style.display == "flex"){
                element.style.display = "none"
                document.getElementById("showMore").innerHTML = "show More"
            }else{
                element.style.display = "flex"
                document.getElementById("showMore").innerHTML = "show Less"
            }
        }
    </script>
</html>
